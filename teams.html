<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams · CBB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cbb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="cbb.js"></script><style>.pend{opacity:.55}.pos{color:#8ee04a}.neg{color:#ff5d6c}td,th{white-space:nowrap}.pl{font-size:13px;line-height:1.6}</style></head><body><div class="w"><h2 style="margin-top:14px">Teams</h2><p class="mut sm" id="sub"></p>
<div class="ctl"><input class="v2" id="q" placeholder="Search team"></div><div id="out" class="gl"></div></div>
<script>var S=function(v){return v==null?"—":(v>0?"+":"")+v.toFixed(1)},P=function(v){return v==null?"—":Math.round(v*100)+"%"},C=function(v){return v>0?"pos":v<0?"neg":""};</script>
<script>CBB.data(function(D){var E=CBB.E;sub.textContent=D.teams.length+" D-I teams. Tap a team for incoming and outgoing players.";
function draw(){var s=q.value.toLowerCase();out.innerHTML=D.teams.slice().sort((a,b)=>a.team.localeCompare(b.team)).filter(t=>!s||t.team.toLowerCase().includes(s)).map(t=>'<a class="card" style="margin:0;padding:12px;display:block" href="team.html?id='+t.id+'"><b>'+E(t.team)+'</b><div class="sm mut">'+E(t.conf)+' · returning prod '+P(t.retProd)+' · in '+t.nIn+' / out '+(t.nOut+t.nLeft)+'</div><div class="sm '+C(t.chg)+'">Projected change '+S(t.chg)+(t.status!="ok"?" (roster pending)":"")+'</div></a>').join("")}
q.oninput=draw;draw()})</script></body></html>
