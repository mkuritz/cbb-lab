<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Method · CBB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cbb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="cbb.js"></script><script src="https://sportslabshq.com/sl/sl.js?v=11" defer></script></head><body><div class="w"><h2 style="margin-top:14px">How "Most Improved" is calculated</h2><div class="card" id="out"></div></div>
<script>CBB.data(function(D){var f=D.meta.fit;out.innerHTML=`
<p><b>Starting point.</b> Each team's adjusted net rating from last season (2025-26): points scored minus allowed per 100 possessions against an average D-I team, adjusted for opponents.</p>
<p><b>Roster moves.</b> We compare last season's rosters with current 2026-27 rosters. For every player who logged D-I minutes last season we know whether he <i>returned</i>, <i>transferred</i> to another D-I school or <i>left</i> (graduated, turned pro or isn't on a D-I roster). Production is measured with last season's win shares.</p>
<p><b>Projection.</b> Projected net = ${f.intercept} + ${f.b_net} × last net + ${f.b_ret} × returning production + ${f.b_in} × incoming transfer production + ${f.b_inq} × (incoming production × strength of the player's old team ÷ 10). Production that left is captured by what <i>didn't</i> return. Inputs are capped at the range seen when the formula was fitted, so no team is pushed past what history supports.</p>
<p><b>Most improved</b> = projected net minus last season's net.</p>
<p><b>How the weights were set.</b> Fitted on the previous offseason (2024-25 → 2025-26, ${f.n} teams). The roster-aware formula explained ${Math.round(f.r2*100)}% of the variation in next-season ratings, versus ${Math.round(f.r2_carry*100)}% for carrying last season's rating forward. On held-out teams the average miss was ${f.holdout.model_mae} points vs ${f.holdout.carry_mae} for carry-forward (${f.holdout.n_test} teams). One season of history is a small sample, so treat this as a guide, not a certainty.</p>
<p><b>Not yet included.</b> Freshmen, international players and transfers from outside D-I have no D-I stats to credit, so they are counted but add nothing; teams with big recruiting classes will look worse than they are. Coaching changes are not modeled. Teams whose current roster hasn't been updated yet are shown as "roster pending" and left out of the ranking.</p>`})</script></body></html>
