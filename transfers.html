<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transfers · CBB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cbb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="cbb.js"></script><style>.pend{opacity:.55}.pos{color:#8ee04a}.neg{color:#ff5d6c}td,th{white-space:nowrap}.pl{font-size:13px;line-height:1.6}</style><script src="https://sportslabshq.com/sl/sl.js?v=10" defer></script></head><body><div class="w"><h2 style="margin-top:14px">Transfers &amp; Roster Changes</h2><p class="mut sm" id="sub"></p>
<div class="ctl"><select class="v2" id="cf"><option value="">All D-I</option></select> <input class="v2" id="q" placeholder="Search player or team"></div><div id="out"></div>
<footer>Every player who played D-I minutes last season and is on a different D-I roster for 2026-27. Last-season numbers are per game; production = win shares. Moves are read from current team rosters and update as rosters change.</footer></div>
<script>var S=function(v){return v==null?"—":(v>0?"+":"")+v.toFixed(1)},P=function(v){return v==null?"—":Math.round(v*100)+"%"},C=function(v){return v>0?"pos":v<0?"neg":""};</script>
<script>CBB.data(function(D){var E=CBB.E;var M=[];D.teams.forEach(t=>t.ins.forEach(p=>M.push(Object.assign({to:t.team,toId:t.id,conf:t.conf},p))));M.sort((a,b)=>(b.ws||0)-(a.ws||0));
sub.textContent=M.length+" D-I to D-I transfers, sorted by last season's production. Tap any player for their 2026-27 projected minutes & usage role.";
cf.innerHTML+=[...new Set(D.teams.map(r=>r.conf))].sort().map(c=>"<option>"+E(c)+"</option>").join("");
function draw(){var s=q.value.toLowerCase();var r=M.filter(m=>(!cf.value||m.conf==cf.value)&&(!s||(m.n+m.tn+m.to).toLowerCase().includes(s))).slice(0,400);
out.innerHTML='<div class="card wrap" style="padding:0"><table><tr><th>Player</th><th>Pos</th><th>From</th><th>To</th><th>Last Min</th><th>Last PPG</th><th>Production (WS)</th></tr>'+r.map(m=>'<tr><td><a href="#" class="plink" data-cbb-player="'+E(m.n)+'" data-cbb-tid="'+m.toId+'" style="color:inherit;font-weight:700">'+E(m.n)+'</a></td><td>'+E(m.pos||"")+'</td><td><a href="team.html?id='+m.t+'">'+E(m.tn)+'</a></td><td><a href="team.html?id='+m.toId+'">'+E(m.to)+'</a></td><td>'+(m.min||0)+'</td><td>'+(m.ppg??"—")+'</td><td>'+(m.ws??"—")+'</td></tr>').join("")+'</table></div>'}
cf.onchange=q.oninput=draw;draw()})</script></body></html>
