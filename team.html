<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team · CBB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cbb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="cbb.js"></script><style>.pend{opacity:.55}.pos{color:#8ee04a}.neg{color:#ff5d6c}td,th{white-space:nowrap}.pl{font-size:13px;line-height:1.6}</style><script src="https://sportslabshq.com/sl/sl.js?v=9" defer></script></head><body><div class="w"><h2 style="margin-top:14px"><span id=tn></span></h2><p class="mut sm" id="sub"></p>
<div id="out"></div><footer>Production = last season's win shares. Ratings: barttorvik.com. Full 2026-27 rosters include returning letterwinners, incoming transfers, and incoming freshmen with Star Player &amp; 2027 NBA Draft Prospect callouts.</footer></div>
<script>var S=function(v){return v==null?"—":(v>0?"+":"")+v.toFixed(1)},P=function(v){return v==null?"—":Math.round(v*100)+"%"},C=function(v){return v>0?"pos":v<0?"neg":""};</script>
<script>CBB.data(function(D){var E=CBB.E;var id=+new URLSearchParams(location.search).get("id");var t=D.teams.find(x=>x.id==id)||D.teams.find(x=>x.ap==1)||D.teams[0];tn.innerHTML=(t.ap?'<span class="ap-tag">#'+t.ap+'</span>':'')+CBB.logo(t.id,28)+' '+E(t.team);document.title=t.team+" · CBB Hub · Sports Labs";
var stars=(t.rot||[]).filter(function(p){return p.is_star||p.nba_prospect});
var nbaCnt=(t.rot||[]).filter(function(p){return p.nba_prospect}).length;
sub.textContent=t.conf+" · "+(t.rot||[]).length+" players on 2026-27 roster ("+stars.length+" Star/Impact, "+nbaCnt+" NBA Draft Prospect"+(nbaCnt===1?"":"s")+") · last season net "+S(t.net)+" → projected "+S(t.proj)+" ("+S(t.chg)+") · Ratings: barttorvik.com";
function pLink(p){return '<a href="#" class="plink" data-cbb-player="'+E(p.id||p.n)+'" data-cbb-tid="'+t.id+'" style="color:inherit;font-weight:700">'+E(p.n)+'</a>'}
function L(a,h,k){return '<div class="card"><h3>'+h+' ('+a.length+')</h3>'+(a.length?'<table><tr><th>Player</th><th>Pos</th>'+(k?'<th>'+k+'</th>':'')+'<th>Min</th><th>PPG</th><th>Production</th></tr>'+a.map(p=>'<tr><td>'+pLink(p)+'</td><td>'+E(p.pos||"")+'</td>'+(k?'<td>'+(p.t?'<a href="team.html?id='+p.t+'">'+E(p.tn)+'</a>':'—')+'</td>':'')+'<td>'+(p.min||0)+'</td><td>'+(p.ppg??"—")+'</td><td>'+(p.ws??"—")+'</td></tr>').join("")+'</table>':'<p class="mut sm">None</p>')+'</div>'}
var ff=t.adjT!=null?'<div class="card"><h3>⚡ Tempo &amp; Four-Factors Style Profile <span class="mut sm" style="font-weight:400">· Ratings: barttorvik.com</span></h3>'+CBB.badgesHtml(t.badges)+'<div class="cmp" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:10px"><div><div class="l">Tempo (AdjT)</div><b>'+t.adjT.toFixed(1)+' poss</b></div><div><div class="l">Torvik AdjO / AdjD</div><b>'+t.adjO.toFixed(1)+' (# '+t.adjO_rk+') / '+t.adjD.toFixed(1)+' (# '+t.adjD_rk+')</b></div><div><div class="l">Roster eFG%</div><b>'+(t.efg!=null?t.efg+'%':'—')+'</b></div><div><div class="l">3P Rate &amp; 3P%</div><b>'+(t.threeRate!=null?t.threeRate+'% · '+(t.threePct||0)+'%':'—')+'</b></div><div><div class="l">ORB Share</div><b>'+(t.orbPct!=null?t.orbPct+'%':'—')+'</b></div><div><div class="l">Press (Stl+Blk/40)</div><b>'+(t.havoc40!=null?t.havoc40:'—')+'</b></div></div></div>':'';

var em=t.exp_meta||{},segs=em.segments||{};
var segHtml=segs.g1_10?'<div class="card" style="border-color:#38d0f055"><h3>📆 Rolling 10-Game Season Segmentation Profile: <span style="color:#7dd3fc">'+E(em.seg_profile||"Balanced Rotation")+'</span></h3>'
 +'<div class="mut sm">Starters breakdown: <b>'+em.st5_fr+' Freshmen · '+em.st5_vet+' Upperclassmen (JR/SR) · '+em.st5_tr+' Transfers</b> · Top-2 Alpha Usage: <b>'+em.top2_usg+'% USG</b></div>'
 +'<div class="cmp" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px">'
 +'<div><div class="l">Segment 1: Games 1–10</div><b style="font-size:17px">'+S(segs.g1_10.em)+' Net</b><div class="mut sm">'+E(segs.g1_10.note)+' · Prior Wt '+E(segs.g1_10.prior_wt)+' · Starters '+segs.g1_10.rot_min_st5+'% min</div></div>'
 +'<div><div class="l">Segment 2: Games 11–20</div><b style="font-size:17px;color:#38d0f0">'+S(segs.g11_20.em)+' Net</b><div class="mut sm">'+E(segs.g11_20.note)+' · Prior Wt '+E(segs.g11_20.prior_wt)+' · Starters '+segs.g11_20.rot_min_st5+'% min</div></div>'
 +'<div><div class="l">Segment 3: Games 21–30</div><b style="font-size:17px;color:#8ee04a">'+S(segs.g21_30.em)+' Net</b><div class="mut sm">'+E(segs.g21_30.note)+' · Prior Wt '+E(segs.g21_30.prior_wt)+' · Starters '+segs.g21_30.rot_min_st5+'% min</div></div>'
 +'</div></div>':'';

var starsHtml=stars.length?'<div class="card"><h3>⭐ Team Stars &amp; 🏀 2027 NBA Draft Prospects ('+stars.length+') <span class="mut sm" style="font-weight:400">· Tap any player for scouting report &amp; prop lines</span></h3><div class="star-grid">'+stars.map(function(p){
 return '<div class="star-card '+(p.nba_prospect?"nba":"")+'" data-cbb-player="'+E(p.id||p.n)+'" data-cbb-tid="'+t.id+'">'
  +'<div style="display:flex;gap:10px;align-items:center">'+CBB.head(p.id,p.n,p.hs,t.col||"#38d0f0",46)
  +'<div style="flex:1;min-width:0"><div style="font-weight:900;font-size:15px">'+E(p.n)+' <span class="mut sm">'+(p.jersey?"#"+E(p.jersey)+" · ":"")+E(p.pos)+" · "+E(p.yr_short||p.yr||"")+(p.ht?" · "+E(p.ht):"")+'</span></div>'
  +'<div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">'+CBB.roleBadge(p)+'</div></div></div>'
  +'<div class="sm" style="color:#d6e2ff;line-height:1.4">'+(p.nba_note?E(p.nba_note):'Projected for <b>'+p.proj_pts+' PPG</b>, <b>'+p.proj_reb+' RPG</b>, <b>'+p.proj_ast+' APG</b> across <b>'+p.proj_min+' MIN</b> ('+p.usg+'% USG).')+'</div>'
  +'<div class="cmp" style="margin-top:2px"><div><div class="l">Proj Min / USG</div><b>'+p.proj_min+'m · '+p.usg+'%</b></div><div><div class="l">2026-27 Proj</div><b>'+p.proj_pts+' / '+p.proj_reb+' / '+p.proj_ast+'</b></div><div><div class="l">Origin</div><b>'+(p.origin==="Transfer"&&p.prev_team?E(p.prev_team):E(p.origin))+'</b></div></div>'
  +'</div>';
}).join("")+'</div></div>':'';

var rotHtml=(t.rot&&t.rot.length)?'<div class="card wrap"><h3>🏀 Complete 2026-27 Team Roster, Starting 5 &amp; Usage Share ('+t.rot.length+' Players) <span class="mut sm" style="font-weight:400">· Starters, minutes projections, usage &amp; NBA prospect badges</span></h3><table><tr><th>Role &amp; Badges</th><th>Player</th><th>Pos · Yr · Ht</th><th>Origin</th><th>Proj Min</th><th>USG%</th><th>Proj PPG</th><th>Proj RPG</th><th>Proj APG</th><th>Proj 3PM</th><th>Last eFG% / TS%</th><th>Last WS</th></tr>'+t.rot.map(function(p,idx){
 var mPct=Math.min(100,Math.round((p.proj_min||0)/36*100));
 var bio=[E(p.pos),E(p.yr_short||p.yr||"—"),E(p.ht||"—")].join(" · ");
 var sep=(idx===5)?'<tr style="background:#0a1324"><td colspan="12" style="font-size:11px;font-weight:800;color:#7dd3fc;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px">Second Unit &amp; Full Roster Depth ('+(t.rot.length-5)+' Players)</td></tr>':'';
 return sep+'<tr><td>'+CBB.roleBadge(p)+'</td><td>'+CBB.head(p.id,p.n,p.hs,t.col||"#38d0f0",26)+' '+pLink(p)+(p.jersey?' <span class="mut sm">#'+E(p.jersey)+'</span>':'')+'</td><td class="sm mut">'+bio+'</td><td class="sm mut">'+(p.origin==="Transfer"&&p.prev_team?'Transfer ('+E(p.prev_team)+')':E(p.origin))+'</td><td><span class="min-bar"><i style="width:'+mPct+'%"></i></span><b>'+p.proj_min+'</b></td><td><span class="usg-pill">'+p.usg+'%</span></td><td><b>'+p.proj_pts+'</b></td><td>'+p.proj_reb+'</td><td>'+p.proj_ast+'</td><td>'+p.proj_tpm+'</td><td class="sm mut">'+(p.gp?p.efg+'% / '+p.ts+'%':'—')+'</td><td>'+(p.gp?p.ws:'—')+'</td></tr>';
}).join("")+'</table></div>':'';

var tHurdles=(D.prop_hurdles||[]).filter(function(h){return h.tid===t.id});
var hHtml=tHurdles.length?'<div class="card wrap"><h3>🔥 Team Prop Hurdles That Keep Rolling ('+tHurdles.length+')</h3><table><tr><th>Player</th><th>Class</th><th>Proj Min</th><th>USG%</th><th>Prop Hurdle</th><th>Our Proj</th><th>Hit Prob (Fair)</th><th>Est L10 / Prior</th></tr>'+tHurdles.map(function(h){
 return '<tr><td><a href="#" class="plink" data-cbb-player="'+E(h.id||h.n)+'" data-cbb-tid="'+t.id+'" style="color:inherit;font-weight:700">'+E(h.n)+'</a></td><td>'+E(h.yr_short)+'</td><td>'+h.proj_min+'m</td><td><span class="usg-pill">'+h.usg+'%</span></td><td><span class="role-pill st">'+E(h.hurdle)+'</span></td><td><b class="pos">'+h.proj+'</b></td><td><b class="pos">'+Math.round(h.p_hit*100)+'%</b> ('+CBB.am(h.fair_odds)+')</td><td>'+E(h.l10_est)+' · '+E(h.szn_est)+'</td></tr>';
}).join("")+'</table></div>':'';

var tProps=(D.props||[]).filter(function(pr){return pr.t===t.id});
var prHtml=tProps.length?'<div class="card wrap"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3>🎯 Opening-Week Player Props ('+E(tProps[0].matchup)+')</h3><a href="props.html?game='+encodeURIComponent(tProps[0].gid)+'" class="chip" style="text-decoration:none">All Game Props →</a></div><table><tr><th>Player</th><th>Role &amp; Badges</th><th>Proj Min / USG%</th><th>Market</th><th>Side &amp; Line</th><th>Our Proj</th><th>Ours</th><th>Fair</th><th>Edge</th></tr>'+tProps.slice(0,10).map(function(pr){
 var po=pr.side==="Over"?pr.ours:(1-pr.ours),pf=pr.side==="Over"?pr.fair:(1-pr.fair);
 return '<tr><td><a href="#" class="plink" data-cbb-player="'+E(pr.aid||pr.nm)+'" data-cbb-tid="'+t.id+'" style="color:inherit;font-weight:700">'+E(pr.nm)+'</a></td><td>'+CBB.roleBadge(pr)+'</td><td class="sm">'+pr.proj_min+' MIN · '+pr.usg+'%</td><td><b>'+E(pr.mk)+'</b></td><td>'+E(pr.side)+' '+pr.line+'</td><td><b>'+pr.proj+'</b></td><td>'+CBB.pc(po)+'</td><td>'+CBB.pc(pf)+'</td><td>'+CBB.edge(pr.edge)+'</td></tr>';
}).join("")+'</table></div>':'';
out.innerHTML=ff+segHtml+starsHtml+hHtml+rotHtml+prHtml+'<div class="card"><b>Returning minutes</b> '+P(t.retMin)+' · <b>Returning production</b> '+P(t.retProd)+' · <b>Production in</b> '+t.inWS+' · <b>Production out</b> '+t.outWS+' · <b>Newcomers w/o D-I stats</b> '+t.nNew+'</div>'+L(t.ins,"Incoming transfers","From")+L(t.outs,"Outgoing transfers","To")+L(t.left,"Other departures (graduated, pro or not on a D-I roster)")})</script></body></html>
