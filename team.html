<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team · CBB Hub · Sports Labs</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="cbb.css"><script src="sl-sports.js"></script><script src="navcfg.js"></script><script src="cbb.js"></script><style>.pend{opacity:.55}.pos{color:#8ee04a}.neg{color:#ff5d6c}td,th{white-space:nowrap}.pl{font-size:13px;line-height:1.6}</style></head><body><div class="w"><h2 style="margin-top:14px"><span id=tn></span></h2><p class="mut sm" id="sub"></p>
<div id="out"></div><footer>Production = last season's win shares. Ratings: barttorvik.com. Newcomers without D-I stats (freshmen, internationals, lower-division transfers) are counted but not yet credited in the projection.</footer></div>
<script>var S=function(v){return v==null?"—":(v>0?"+":"")+v.toFixed(1)},P=function(v){return v==null?"—":Math.round(v*100)+"%"},C=function(v){return v>0?"pos":v<0?"neg":""};</script>
<script>CBB.data(function(D){var E=CBB.E;var id=+new URLSearchParams(location.search).get("id");var t=D.teams.find(x=>x.id==id)||D.teams[0];tn.innerHTML=(t.ap?'<span class="ap-tag">#'+t.ap+'</span>':'')+E(t.team);document.title=t.team+" · CBB Hub · Sports Labs";
sub.textContent=t.conf+" · last season net "+S(t.net)+" → projected "+S(t.proj)+" ("+S(t.chg)+")"+(t.status!="ok"?" · roster not yet updated, projection on hold":"");
function L(a,h,k){return '<div class="card"><h3>'+h+' ('+a.length+')</h3>'+(a.length?'<table><tr><th>Player</th><th>Pos</th>'+(k?'<th>'+k+'</th>':'')+'<th>Min</th><th>PPG</th><th>Production</th></tr>'+a.map(p=>'<tr><td>'+E(p.n)+'</td><td>'+E(p.pos||"")+'</td>'+(k?'<td>'+(p.t?'<a href="team.html?id='+p.t+'">'+E(p.tn)+'</a>':'—')+'</td>':'')+'<td>'+(p.min||0)+'</td><td>'+(p.ppg??"—")+'</td><td>'+(p.ws??"—")+'</td></tr>').join("")+'</table>':'<p class="mut sm">None</p>')+'</div>'}
var ff=t.adjT!=null?'<div class="card"><h3>⚡ Tempo &amp; Four-Factors Style Profile <span class="mut sm" style="font-weight:400">· Ratings: barttorvik.com</span></h3>'+CBB.badgesHtml(t.badges)+'<div class="cmp" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:10px"><div><div class="l">Tempo (AdjT)</div><b>'+t.adjT.toFixed(1)+' poss</b></div><div><div class="l">Torvik AdjO / AdjD</div><b>'+t.adjO.toFixed(1)+' (# '+t.adjO_rk+') / '+t.adjD.toFixed(1)+' (# '+t.adjD_rk+')</b></div><div><div class="l">Roster eFG%</div><b>'+(t.efg!=null?t.efg+'%':'—')+'</b></div><div><div class="l">3P Rate &amp; 3P%</div><b>'+(t.threeRate!=null?t.threeRate+'% · '+(t.threePct||0)+'%':'—')+'</b></div><div><div class="l">ORB Share</div><b>'+(t.orbPct!=null?t.orbPct+'%':'—')+'</b></div><div><div class="l">Press (Stl+Blk/40)</div><b>'+(t.havoc40!=null?t.havoc40:'—')+'</b></div></div></div>':'';
out.innerHTML=ff+'<div class="card"><b>Returning minutes</b> '+P(t.retMin)+' · <b>Returning production</b> '+P(t.retProd)+' · <b>Production in</b> '+t.inWS+' · <b>Production out</b> '+t.outWS+' · <b>Newcomers w/o D-I stats</b> '+t.nNew+'</div>'+L(t.ins,"Incoming transfers","From")+L(t.outs,"Outgoing transfers","To")+L(t.left,"Other departures (graduated, pro or not on a D-I roster)")})</script></body></html>
